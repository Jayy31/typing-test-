[project]
name = "news-options-worker"
version = "0.1.0"
description = "News-driven research and paper trading worker for NSE F&O stock options"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1.15.0",
    "apscheduler>=3.10,<4",
    "feedparser>=6.0.14",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "tzdata>=2024.1",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-pyyaml",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/notify/explain.py" = ["E501"]  # message text formatting

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "feedparser.*", "yfinance.*"]
ignore_missing_imports = true
