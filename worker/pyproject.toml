[project]
name = "news-options-worker"
version = "0.1.0"
description = "News-driven research and paper trading worker for NSE F&O stock options"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1.15.0",
    "apscheduler>=3.10,<4",
    "boto3>=1.43.114",
    "duckdb>=1.5.6",
    "feedparser>=6.0.14",
    "httpx>=0.27",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "tzdata>=2024.1",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-pyyaml",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/notify/explain.py" = ["E501"]  # message text formatting
"app/notify/templates.py" = ["E501"]
"app/notify/telegram.py" = ["E501"]
"app/notify/digest.py" = ["E501"]
"tests/*" = ["E501"]
"app/history/verify.py" = ["E501"]  # report SQL
"app/history/tagging.py" = ["E501"]
"app/history/news_history.py" = ["E501"]
"app/history/event_study.py" = ["E501"]
"app/history/analogues.py" = ["E501"]
"app/ai/analyst.py" = ["E501"]
"app/history/*.py" = ["E501"]
"app/calibration/*.py" = ["E501"]
"app/ai/panel.py" = ["E501"]
"app/ai/client.py" = ["E501"]
"app/ai/smoke.py" = ["E501"]
"app/ai/schemas.py" = ["E501"]
"app/tracking/*.py" = ["E501"]
"app/signals/*.py" = ["E501"]
"app/history/iv_backfill.py" = ["E501"]  # long assertion messages and fixtures

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "feedparser.*", "yfinance.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
