# History store (Phase 4). URL templates and column names are from NSE archive conventions and
# community sources; they could NOT be checked from the build sandbox. If a backfill reports
# "missing column", fix the mapping here (no code change needed) and re-run: loads are idempotent.
years: 5
http:
  min_interval_s: 1.0           # polite: at most 1 request per second
  timeout_s: 30
  retries: 2

sources:
  equity:                       # daily OHLC + volume + delivery % (security-wise full bhavdata)
    url: "https://nsearchives.nseindia.com/products/content/sec_bhavdata_full_{ddmmyyyy}.csv"
    series: ["EQ"]
    columns: {symbol: SYMBOL, series: SERIES, open: OPEN_PRICE, high: HIGH_PRICE, low: LOW_PRICE,
              close: CLOSE_PRICE, volume: TTL_TRD_QNTY, delivery_pct: DELIV_PER}
  fo_old:                       # F&O bhavcopy, old format (discontinued mid-2024)
    until: "2024-07-05"
    url: "https://archives.nseindia.com/content/historical/DERIVATIVES/{yyyy}/{mmm}/fo{ddMMMyyyy}bhav.csv.zip"
    instrument: OPTSTK
    futures_instrument: FUTSTK      # Phase 12: stock futures rows (data only, never traded)
    expiry_format: "%d-%b-%Y"
    columns: {instrument: INSTRUMENT, symbol: SYMBOL, expiry: EXPIRY_DT, strike: STRIKE_PR,
              type: OPTION_TYP, open: OPEN, high: HIGH, low: LOW, close: CLOSE, settle: SETTLE_PR,
              oi: OPEN_INT, chg_oi: CHG_IN_OI, volume: CONTRACTS}
  fo_udiff:                     # F&O bhavcopy, UDiFF format (from July 2024)
    from: "2024-07-08"
    url: "https://nsearchives.nseindia.com/content/fo/BhavCopy_NSE_FO_0_0_0_{yyyymmdd}_F_0000.csv.zip"
    instrument: STO
    futures_instrument: STF
    expiry_format: "%Y-%m-%d"
    columns: {instrument: FinInstrmTp, symbol: TckrSymb, expiry: XpryDt, strike: StrkPric,
              type: OptnTp, open: OpnPric, high: HghPric, low: LwPric, close: ClsPric,
              settle: SttlmPric, oi: OpnIntrst, chg_oi: ChngInOpnIntrst, volume: TtlTradgVol,
              lot_size: NewBrdLotQty, underlying: UndrlygPric}
  index:                        # all NSE indices incl. NIFTY 50 and India VIX
    url: "https://archives.nseindia.com/content/indices/ind_close_all_{ddmmyyyy}.csv"
    # Nifty 50 (market), India VIX (regime) and the sector indices used as sector benchmarks
    names: ["Nifty 50", "India VIX", "Nifty Bank", "Nifty IT", "Nifty Pharma", "Nifty Auto",
            "Nifty Metal", "Nifty FMCG", "Nifty Realty", "Nifty Energy", "Nifty Oil & Gas",
            "Nifty Financial Services", "Nifty Healthcare Index", "Nifty Infrastructure",
            "Nifty India Defence", "Nifty Media", "Nifty PSU Bank"]
    columns: {name: "Index Name", close: "Closing Index Value"}
  announcements:                # NSE corporate announcements history, fetched in monthly chunks
    path: "/api/corporate-announcements?index=equities&from_date={from_ddmmyyyy}&to_date={to_ddmmyyyy}"
  corporate_actions:            # NSE corporate actions history (ex-dates), monthly chunks
    path: "/api/corporates-corporateActions?index=equities&from_date={from_ddmmyyyy}&to_date={to_ddmmyyyy}"
  gdelt:                        # GDELT DOC API covers only ~the last 3 months: used going forward
    url: "https://api.gdeltproject.org/api/v2/doc/doc"
    query: '(sourcecountry:IN) (Sensex OR Nifty OR "RBI" OR "SEBI")'
    max_records: 250

event_study:
  windows: [0, 1, 3, 5, 10]     # trading days after the event (0 = event day)
  pre_drift_days: 5             # pre-event drift window (-5..-1)
  beta_lookback_days: 250
  beta_min_obs: 60
  market_index: "Nifty 50"
  # Reaction day from the announcement time (IST): before open -> same day (gap at the open);
  # during market hours -> same day, flagged 'intraday' (part of the move may precede the news);
  # after the close or on a non-trading day -> next trading day; no time -> same day, 'unknown'.
  market_open: "09:15"
  market_close: "15:30"
  timing_weights: {pre_open: 1.0, intraday: 1.0, post_close: 1.0, non_trading_day: 1.0, unknown: 0.5}
  point_in_time_universe: true  # only events on stocks that were in F&O on the reaction day
  corporate_action_buffer_days: 3   # drop windows within +-3 trading days of a split/bonus/demerger/special dividend
  confounding:                  # another major event for the same stock (or a sector-wide event) in the window
    mode: downweight            # downweight | exclude
    weight: 0.5
    major_event_types: [results, mna, regulatory, legal_fraud, management, rating, block_deal,
                        corporate_action, disaster, policy]
  # Abnormal return vs the stock's sector index (fallback Nifty 50); both are stored.
  # Market-wide event types always use Nifty 50 (a sector index would absorb the reaction).
  market_benchmark_event_types: [policy, macro_data, geopolitical, commodity]
  sector_index:
    Banks: "Nifty Bank"
    IT: "Nifty IT"
    Pharma: "Nifty Pharma"
    Healthcare: "Nifty Healthcare Index"
    Auto: "Nifty Auto"
    Metals: "Nifty Metal"
    FMCG: "Nifty FMCG"
    Realty: "Nifty Realty"
    Power: "Nifty Energy"
    "Oil & Gas": "Nifty Oil & Gas"
    NBFC: "Nifty Financial Services"
    Insurance: "Nifty Financial Services"
    Infrastructure: "Nifty Infrastructure"
    Defence: "Nifty India Defence"
  regimes:                      # market regime by India VIX at the event (no technical indicators)
    vix_low: 13
    vix_high: 20
  # Analogue weight in predictions = n / (n + ANALOGUE_PRIOR_N) (env, default 20), and only with
  # at least ANALOGUE_MIN_N (env, default 5) events; n = effective (weighted) count.
  examples: 5

iv_backfill:
  lookback_days: 365            # IV percentile window once history exists
  max_strikes_each_side: 3      # per expiry per day, around the day's ATM
  min_premium: 0.5

corporate_actions:
  manual_file: corporate_actions.yaml   # in data/: owner-verified factors (e.g. demergers)
  max_move_without_action_pct: 25       # verify flags bigger one-day moves with no action recorded

blend:                          # predicted move once analogues exist (before calibration in Phase 5)
  analogue_window: 3            # which event-study window feeds predictions (trading days)

backup:
  every_days: 7
  include: ["parquet", "history.duckdb"]
