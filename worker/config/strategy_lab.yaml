# Strategy Lab (Phase 14, feat.strategy_lab). Offline research: specs are tested by the same
# backtester (fills, costs, fillability, exit engine, walk-forward folds) as live, validated with
# anti-overfitting controls, and survivors run as separate paper books. The lab never changes live
# config; a validated strategy reaches the main engine only via a learning-loop suggestion PR.

# ---- spec vocabulary and defaults (app/lab/spec.py) -----------------------------------------
spec:
  max_days_before_event: 10          # entry N trading days before a scheduled event: 1..this
  min_intimation_days: 2             # skip if the event date became public fewer than N trading days before entry
  max_hold_days: 20
  strike_modes: [atm, itm1, itm2, otm1, delta]
  delta_range: [0.25, 0.75]
  sources: [data_mining, known_pattern, system_evidence, ai_proposal, news_core]
  scheduled_event_types: [results]   # event types with a known date in advance (hist_scheduled)
  adv_window_days: 20                # liquidity / size proxy: average daily traded value (Rs crore)
  iv_percentile_lookback_days: 252

# ---- validation ladder (app/lab/validate.py) -------------------------------------------------
# Stage 0 screening: 5-year walk-forward on PRE-cutoff data only (AI_MODEL_KNOWLEDGE_CUTOFF).
# Stage 1 holdout: post-cutoff data, evaluated exactly once when it has enough trades/events.
stage0:
  min_trades: 60
  min_events: 40                     # independent events (same day + event type = one)
  require_ci_lower_above: 0.0        # 90% bootstrap CI of expectancy (% of premium) must exclude 0
  deflated_sharpe_min: 0.95          # probability that the Sharpe beats the best of N null trials
  min_sharpe_variance: 0.01          # floor for the variance of Sharpe ratios across trials
holdout:
  min_trades: 20
  min_events: 15
  require_expectancy_above: 0.0
  require_cost_stress: true          # also positive at the stress spread
luck:
  plateau:
    min_share_profitable: 0.7        # neighbouring settings that must also be profitable
    threshold_step: 0.10             # thresholds +-10%
    day_steps: [1, 2]                # entry/exit days +-1, +-2
  placebo:
    runs: 100                        # random date shifts per spec (seeded)
    max_shift_days: 20
    min_shift_days: 3                # never land on (or next to) the real date
    real_must_beat_percentile: 95
  max_profit_share_per_stock: 0.25
  max_profit_share_per_month: 0.25
  cost_stress_spread_mult: 2.0
  regime:
    min_trades_per_regime: 10
    min_share_regimes_positive: 0.5  # of regimes with enough trades

registry:
  max_variants_per_hypothesis: 10
  history_start: "2021-01-01"        # screening starts here (or the first day of the store)

# ---- lab AI (same provider-neutral layer and AI_ALLOWED_MODELS check as the research agent) ----
# Override per field with env LAB_<ROLE>_<FIELD>, e.g. LAB_HYPOTHESIS_MAX_INR=8.
roles:
  lab_hypothesis:            # proposals and refinement
    provider: anthropic
    model: claude-sonnet-5-5
    effort: medium
    max_tool_calls: 8
    max_input_tokens: 80000
    max_output_tokens: 8000
    max_inr: 15
    timeout_s: 240
  lab_summary:               # trial diagnostics write-ups, weekly summary, monthly section
    provider: anthropic
    model: claude-haiku-5-5
    effort: low
    max_tool_calls: 0
    max_input_tokens: 20000
    max_output_tokens: 1500
    max_inr: 1
    timeout_s: 90
estimates_inr: {lab_hypothesis: 8, lab_summary: 0.2}
# Lab caps inside the overall AI budget. The lab pauses FIRST: it also stops this far below the
# overall caps (on top of the tagger reserve), so other AI keeps running.
budgets: {daily_inr: 30, monthly_inr: 600}
pause_first_headroom: {daily_inr: 20, monthly_inr: 150}

# ---- idea sources and the overnight loop (app/lab/nightly.py, 23:10 IST) ----------------------
schedule:
  ai_proposals_per_week: 3
  max_new_mined_per_night: 5
  max_screens_per_night: 6           # specs through Stage 0 per night (placebo runs are the cost)
  max_ai_refinements_per_night: 2
  max_summaries_per_night: 10
  evidence_every_days: 7
mining:                              # data_mining: pre-cutoff event-study groups, no AI
  window: 3
  min_n: 40
  min_hit_rate: 0.58
  require_ci_lower_above: 0.0
  stable_halves: true                # positive mean in both halves of the period
  splits: [none, sector, regime]
refine:
  deterministic_grid:                # variants tried before any AI refinement
    - {option: {strike: itm1}}
    - {entry: {timing: next_open}}
    - {exits: {max_hold_days: 5}}
    - {exits: {rule_set: fixed}}
  ai_sources: [ai_proposal, system_evidence]   # AI refinement only for these
evidence:                            # system_evidence detectors (thresholds)
  iv_crush_losses: 4                 # post-mortems with cause iv_crush in 60 days
  rejected_winners: 6                # rejected candidates whose counterfactual won, per stage
  watchlist_gate_edge: 8             # watchlist trades beating the main book on one gate
  lookback_days: 60
