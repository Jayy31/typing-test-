# AI cost model. Model ids come from env (AI_MODEL_<ROLE>). Prices are config, not code: edit
# them here when Anthropic changes pricing. USD per million tokens.
# Checked against https://platform.claude.com/docs/en/about-claude/pricing on 2026-10-19.
prices_checked: "2026-10-19"
usd_inr: 88.0
batch_discount: 0.5          # Message Batches API bills 50% of standard prices
# Per model id (the exact value you set in AI_MODEL_<ROLE>). cache_write = 5-minute cache writes
# (what the client uses). long_context: prices for a request whose prompt (input + cache reads +
# cache writes) is over `threshold` tokens.
models:
  claude-haiku-5-5:
    {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125,
     long_context: {threshold: 100000, input: 0.50, output: 2.50, cache_read: 0.05, cache_write: 0.625}}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
  claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
# Server tools (Phase 13 research agent), checked 2026-10-19: web search $10 per 1,000 searches
# plus tokens; web fetch has no extra fee (fetched content is input tokens); code execution is free
# when used with web_search/web_fetch _20260209 (the only way the agent gets it).
server_tools: {web_search_per_1000_usd: 10.0, web_fetch_per_1000_usd: 0.0}
# Fallback by tier when a model id is not listed above (same numbers as the models above).
prices:
  cheap:  {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}   # Haiku 5.5
  mid:    {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}   # Sonnet 5.5
  strong: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}   # Opus 5.5
# Price tier of each role's DEFAULT model (cheap = Haiku 5.5, mid = Sonnet 5.5, strong = Opus 5.5).
# Only used when the configured model id has no row under `models`; keep in sync if you change
# an AI_MODEL_* value.
roles:
  tagger: cheap         # AI_MODEL_TAGGER (Haiku)
  researcher: cheap     # AI_MODEL_RESEARCHER (Haiku)
  novelty: cheap        # AI_MODEL_NOVELTY (Haiku)
  analyst: mid          # AI_MODEL_ANALYST (Sonnet): single analyst, also the research-agent fallback
  bull: cheap           # AI_MODEL_BULL (Haiku)
  bear: cheap           # AI_MODEL_BEAR (Haiku)
  judge: mid            # AI_MODEL_JUDGE (Sonnet)
  postmortem: cheap     # AI_MODEL_POSTMORTEM (Haiku)
  extractor: cheap      # Phase 7 results / auto-sales extraction (AI_MODEL_TAGGER, Haiku)
  extractor_fallback: cheap  # when the first extract fails validation (AI_MODEL_RESULTS_FALLBACK, Haiku)
  kg_extractor: cheap   # Phase 8 company links (AI_MODEL_TAGGER, Haiku)
  report_writer: cheap  # Phase 10 monthly summary paragraph (AI_MODEL_TAGGER, Haiku)
  # Phase 13 research agent: models come from config/research_agent.yaml (preset per role);
  # these tiers are only the fallback when that model id is not listed under `models`.
  research_files: cheap
  research_live: mid
  research_top: mid
  research_review: mid
# Tagger batching and limits
tagger:
  max_items_per_run: 40
  max_tokens: 700
  body_chars: 1200
  # Haiku-tier models can run with thinking off for cheap tagging. Set to null to omit the
  # parameter (needed if AI_MODEL_TAGGER is a model that rejects disabled thinking).
  thinking: {type: disabled}
  # Rough per-item token sizes used only for cost ESTIMATES shown before one-off batch jobs.
  est_input_tokens: 1400
  est_output_tokens: 250

# Multi-agent panel (Phase 5). max_tokens include thinking. `effort` per role is optional
# (omitted = the model's default effort).
agents:
  researcher: {max_tokens: 4000}
  novelty: {max_tokens: 2000}
  bull: {max_tokens: 8000}
  bear: {max_tokens: 8000}
  judge: {max_tokens: 12000}
  analyst: {max_tokens: 8000}
  postmortem: {max_tokens: 3000}
  extractor: {max_tokens: 1500, doc_chars: 24000}
  report_writer: {max_tokens: 600, enabled: true, max_words: 140}
  parallel_bull_bear: true
  # Effort per role (low/medium/high/xhigh/max); omitted = the model's default. Thinking cannot be
  # turned off on Opus 5.5 / Sonnet 5.5, so effort is the speed/cost lever. The smoke test may
  # override a role in the config table (`ai.effort.<role>`) if it is too slow or fails the schema.
  effort:
    researcher: low
    novelty: low
    bull: medium
    bear: medium
    judge: medium
    analyst: medium
    postmortem: low
    extractor_fallback: low
  max_retries: 1                 # schema-validation retries per agent call

# Live smoke test (`make smoke-ai`, and once on VM startup until it passes)
smoke:
  limit_inr: 50                  # hard limit for one smoke run, including an auto-fix re-run
  max_panel_seconds: 180
  max_auto_attempts: 3           # startup runs stop after this many failed runs
  # Phase 13: one research-agent run (research_live role, real tools and web) on the same sample.
  # Its own hard limit, on top of limit_inr: the panel/analyst/post-mortem worst-case
  # reservations leave too little of the Rs 50 for a ~Rs 26 investigation.
  agent_limit_inr: 30
  agent_margin_inr: 5            # the run stops this far below the limit (one turn can overshoot)
  estimates_inr: {researcher: 0.10, novelty: 0.05, bull: 3.2, bear: 3.2, judge: 9.5, analyst: 3.6, postmortem: 1.8}
