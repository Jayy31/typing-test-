# AI cost model. Model ids come from env (AI_MODEL_*); prices are per tier and editable.
# USD per million tokens. Check current pricing at https://www.anthropic.com/pricing
usd_inr: 88.0
tiers:
  tagger:   {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
  analyst:  {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  reviewer: {input: 4.00, output: 20.00, cache_read: 0.40, cache_write: 5.00}
# Tagger batching and limits
tagger:
  max_items_per_run: 40
  max_tokens: 700
  body_chars: 1200
  # Haiku-tier models can run with thinking off for cheap tagging. Set to null to omit the
  # parameter (needed if AI_MODEL_TAGGER is a model that rejects disabled thinking).
  thinking: {type: disabled}
